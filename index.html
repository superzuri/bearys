<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Beary's Inventario</title>

<style>

/* =========================================================
   🐻 BEARY'S INVENTARIO 2.0
   Cute Coffee Shop Edition
========================================================= */

:root {
    --rosa-fondo: #ffdce8;
    --rosa-suave: #ffeaf1;
    --rosa-card: #fffafb;
    --rosa-borde: #f4d4df;
    --rosa-fuerte: #e98baa;

    --cafe: #4b2e25;
    --cafe-titulo: #6b3e31;
    --cafe-suave: #81584c;
    --cafe-claro: #a47770;

    --verde: #62b86f;
    --amarillo: #e8bc55;
    --rojo: #df6565;

    --sombra:
        0 9px 24px rgba(100,55,45,.13);

    --sombra-suave:
        0 5px 15px rgba(120,70,60,.11);

    --transicion:
        .25s cubic-bezier(.22,1,.36,1);
}


/* =========================================================
   🌸 BASE
========================================================= */

* {
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {

    margin: 0;

    padding:
        25px 15px 40px;

    font-family:
        Arial,
        sans-serif;

    background:
        var(--rosa-fondo);

    color:
        var(--cafe);

    transition:
        background-color .4s,
        color .4s;

    overflow-x: hidden;

    position: relative;
}


/* =========================================================
   ✨ DECORACIÓN DEL FONDO
========================================================= */

body::before {

    content: "";

    position: fixed;

    width: 180px;
    height: 180px;

    top: 80px;
    left: -95px;

    border-radius: 50%;

    background:
        rgba(255,255,255,.20);

    pointer-events: none;

    z-index: -1;

    animation:
        burbujaGrande 7s ease-in-out infinite;
}

body::after {

    content: "";

    position: fixed;

    width: 230px;
    height: 230px;

    right: -125px;
    bottom: 80px;

    border-radius: 50%;

    background:
        rgba(255,255,255,.16);

    pointer-events: none;

    z-index: -1;

    animation:
        burbujaGrande 9s 1s ease-in-out infinite reverse;
}

@keyframes burbujaGrande {

    0%,100% {
        transform:
            translateY(0)
            scale(1);
    }

    50% {
        transform:
            translateY(-18px)
            scale(1.06);
    }
}


/* =========================================================
   🐻 OSITOS DE ARRIBA
========================================================= */

.decoracionSuperior {

    display: flex;

    justify-content: center;

    align-items: center;

    gap: 14px;

    height: 42px;

    margin-bottom: 7px;

    overflow: hidden;

    position: relative;
}

.decoracionSuperior::before {

    content: "✦";

    position: absolute;

    left: 19%;

    top: 3px;

    font-size: 12px;

    color: rgba(107,62,49,.38);

    animation:
        estrellaFlota 2.5s ease-in-out infinite;
}

.decoracionSuperior::after {

    content: "♡";

    position: absolute;

    right: 19%;

    bottom: 2px;

    font-size: 13px;

    color: rgba(107,62,49,.35);

    animation:
        estrellaFlota 3s .5s ease-in-out infinite;
}

.decoracionSuperior span {

    display: inline-block;

    font-size: 23px;

    opacity: .84;

    filter:
        drop-shadow(0 2px 2px rgba(100,55,45,.08));

    animation:
        ositosArriba 3.2s ease-in-out infinite;

    transition:
        transform .25s;
}

.decoracionSuperior span:nth-child(2) {
    animation-delay: .25s;
}

.decoracionSuperior span:nth-child(3) {
    animation-delay: .5s;
}

.decoracionSuperior span:nth-child(4) {
    animation-delay: .75s;
}

.decoracionSuperior span:nth-child(5) {
    animation-delay: 1s;
}

.decoracionSuperior span:nth-child(6) {
    animation-delay: 1.25s;
}

.decoracionSuperior span:nth-child(7) {
    animation-delay: 1.5s;
}

@keyframes ositosArriba {

    0%,100% {
        transform:
            translateY(0)
            rotate(0deg)
            scale(1);
    }

    25% {
        transform:
            translateY(-5px)
            rotate(-5deg)
            scale(1.05);
    }

    50% {
        transform:
            translateY(2px)
            rotate(4deg)
            scale(.98);
    }

    75% {
        transform:
            translateY(-3px)
            rotate(-3deg)
            scale(1.03);
    }
}

@keyframes estrellaFlota {

    0%,100% {
        transform:
            translateY(0)
            rotate(0deg);
        opacity: .35;
    }

    50% {
        transform:
            translateY(-5px)
            rotate(15deg);
        opacity: .75;
    }
}


/* =========================================================
   ✨ CAMBIO DE DECORACIÓN
========================================================= */

.decoracionCambio {

    animation:
        cambioOsitos .4s ease both;
}

@keyframes cambioOsitos {

    0% {
        opacity: .1;

        transform:
            translateY(-7px)
            scale(.92);
    }

    55% {
        opacity: 1;

        transform:
            translateY(2px)
            scale(1.06);
    }

    100% {
        opacity: 1;

        transform:
            translateY(0)
            scale(1);
    }
}


/* =========================================================
   🌙 MODO OSCURO
========================================================= */

.modoSuperior {

    position: absolute;

    top: 15px;
    right: 15px;

    display: flex;

    align-items: center;

    gap: 7px;

    padding: 5px 7px;

    border-radius: 999px;

    background:
        rgba(255,255,255,.35);

    box-shadow:
        0 4px 12px rgba(100,55,45,.08);

    backdrop-filter:
        blur(7px);

    -webkit-backdrop-filter:
        blur(7px);

    z-index: 100;

    transition:
        background .4s,
        box-shadow .4s;
}

#iconoModo {

    font-size: 19px;

    transition:
        transform .4s;
}

.modoSuperior:hover #iconoModo {

    transform:
        rotate(18deg)
        scale(1.1);
}

.interruptor {

    position: relative;

    width: 48px;

    height: 26px;

    display: inline-block;
}

.interruptor input {

    opacity: 0;

    width: 0;

    height: 0;
}

.slider {

    position: absolute;

    inset: 0;

    cursor: pointer;

    background:
        #c58a79;

    border-radius: 30px;

    transition: .4s;

    box-shadow:
        inset 0 1px 3px rgba(0,0,0,.12);
}

.slider::before {

    content: "";

    position: absolute;

    width: 20px;
    height: 20px;

    left: 3px;
    top: 3px;

    background:
        white;

    border-radius: 50%;

    transition: .4s;

    box-shadow:
        0 2px 6px rgba(0,0,0,.22);
}

.interruptor input:checked + .slider {

    background:
        #70483c;
}

.interruptor input:checked + .slider::before {

    transform:
        translateX(22px);
}


/* =========================================================
   🧸 CONTENEDOR
========================================================= */

.contenedor {

    max-width: 650px;

    margin: auto;

    position: relative;
}


/* =========================================================
   ☕ TITULO
========================================================= */

h1 {

    text-align: center;

    margin:
        5px 0 5px;

    color:
        var(--cafe-titulo);

    font-size: 30px;

    letter-spacing:
        -.4px;

    text-shadow:
        0 2px 0 rgba(255,255,255,.5);

    animation:
        tituloEntrada .8s ease both;
}

.subtitulo {

    text-align: center;

    margin:
        0 0 5px;

    color:
        var(--cafe-suave);

    font-size: 14px;

    animation:
        tituloEntrada .8s .12s ease both;
}

#fecha {

    text-align: center;

    font-size: 13px;

    color:
        #946c60;

    margin-bottom:
        18px;

    animation:
        tituloEntrada .8s .2s ease both;
}

@keyframes tituloEntrada {

    from {
        opacity: 0;

        transform:
            translateY(-15px);
    }

    to {
        opacity: 1;

        transform:
            translateY(0);
    }
}


/* =========================================================
   🔎 BUSCADOR
========================================================= */

.buscador {

    width: 100%;

    border:
        2px solid transparent;

    outline: none;

    padding:
        14px 16px 14px 43px;

    border-radius:
        18px;

    background:
        rgba(255,255,255,.92);

    box-shadow:
        var(--sombra-suave);

    font-size: 15px;

    color:
        #54342b;

    margin-bottom:
        18px;

    transition:
        transform .22s,
        box-shadow .22s,
        background .22s,
        border-color .22s;

    background-image:
        linear-gradient(
            transparent,
            transparent
        );
}

.buscador::placeholder {

    color:
        #ad8880;
}

.buscador:focus {

    transform:
        translateY(-2px)
        scale(1.005);

    border-color:
        rgba(201,130,148,.35);

    box-shadow:
        0 9px 23px rgba(120,70,60,.17),
        0 0 0 4px rgba(233,139,170,.09);
}

.buscador.busquedaActiva {

    box-shadow:
        0 8px 21px rgba(120,70,60,.18);
}


/* =========================================================
   📦 AREAS
========================================================= */

.area {

    background:
        rgba(255,255,255,.94);

    border-radius:
        24px;

    padding:
        16px;

    margin-bottom:
        18px;

    box-shadow:
        var(--sombra);

    overflow:
        hidden;

    position:
        relative;

    transition:
        transform .3s,
        box-shadow .3s,
        opacity .2s;
}


/* pequeño brillo */

.area::before {

    content: "";

    position: absolute;

    top: 0;
    left: 18px;
    right: 18px;

    height: 2px;

    border-radius:
        0 0 10px 10px;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(233,139,170,.38),
            transparent
        );

    opacity: .7;
}

.area:hover {

    transform:
        translateY(-3px);

    box-shadow:
        0 13px 29px rgba(100,55,45,.17);
}

#gris .area {

    animation:
        tarjetaEntrada
        .8s
        .65s
        cubic-bezier(.22,1,.36,1)
        both;
}

#morado .area {

    animation:
        tarjetaEntrada
        .8s
        1.05s
        cubic-bezier(.22,1,.36,1)
        both;
}

#comida .area {

    animation:
        tarjetaEntrada
        .8s
        1.45s
        cubic-bezier(.22,1,.36,1)
        both;
}

@keyframes tarjetaEntrada {

    0% {

        opacity: 0;

        transform:
            translateY(45px)
            scale(.94);
    }

    55% {

        opacity: 1;

        transform:
            translateY(-7px)
            scale(1.015);
    }

    75% {

        transform:
            translateY(3px)
            scale(.997);
    }

    100% {

        opacity: 1;

        transform:
            translateY(0)
            scale(1);
    }
}


/* =========================================================
   🏷️ TITULOS DE AREA
========================================================= */

.tituloArea {

    display: flex;

    align-items: center;

    justify-content: space-between;

    margin-bottom:
        10px;

    padding:
        2px 3px 9px;

    border-bottom:
        2px dashed #efd0d8;

    position: relative;
}

.tituloArea h2 {

    margin: 0;

    font-size: 18px;

    color:
        #633c32;

    transition:
        transform .25s;
}

.area:hover .tituloArea h2 {

    transform:
        translateX(2px);
}


/* =========================================================
   🐻 PRODUCTOS
========================================================= */

.producto {

    display: flex;

    align-items: center;

    justify-content: space-between;

    gap: 10px;

    padding:
        10px 5px;

    border-bottom:
        1px solid #f3e2e5;

    opacity: 1;

    transform:
        translateY(0);

    border-radius:
        12px;

    transition:
        background .2s,
        transform .2s,
        opacity .15s,
        padding .2s;
}

.producto:last-child {

    border-bottom:
        none;
}

.producto:hover {

    background:
        #fff5f8;

    transform:
        translateX(3px);

    padding-left:
        8px;

    padding-right:
        8px;
}

.producto:active {

    transform:
        translateX(3px)
        scale(.995);
}


/* =========================================================
   📝 NOMBRE + META
========================================================= */

.infoProducto {

    display: flex;

    flex-direction: column;

    align-items: flex-start;

    justify-content: center;

    gap: 3px;

    flex: 1;

    min-width: 0;
}

.nombre {

    font-size: 14px;

    font-weight: 500;

    line-height: 1.2;

    color:
        #4b2e25;
}

.metaProducto {

    font-size: 12px;

    font-weight: 600;

    color:
        #a47770;

    opacity:
        .85;

    line-height:
        1.2;
}


/* =========================================================
   🔢 CONTROLES
========================================================= */

.controlCantidad {

    display: flex;

    align-items: center;

    gap: 7px;

    flex-shrink: 0;
}

.cantidad {

    width:
        70px;

    border:
        2px solid #ead0d6;

    background:
        #fffafb;

    border-radius:
        12px;

    padding:
        8px 7px;

    text-align:
        center;

    outline:
        none;

    color:
        #4d3028;

    font-size:
        14px;

    font-weight:
        600;

    transition:
        .25s;
}

.cantidad:hover {

    border-color:
        #dfb5c1;

    background:
        #fff;
}

.cantidad:focus {

    border-color:
        #c98294;

    background:
        #fff;

    transform:
        scale(1.05);

    box-shadow:
        0 0 0 4px rgba(201,130,148,.10);
}


/* =========================================================
   ✨ BUSQUEDA
========================================================= */

.producto.busquedaEntrada {

    animation:
        productoBusqueda
        .18s
        ease-out
        both;
}

@keyframes productoBusqueda {

    from {

        opacity: 0;

        transform:
            translateY(-4px);
    }

    to {

        opacity: 1;

        transform:
            translateY(0);
    }
}


/* =========================================================
   🚦 SEMAFORO
========================================================= */

.semaforo {

    width:
        11px;

    height:
        11px;

    border-radius:
        50%;

    background:
        #c7c7c7;

    flex-shrink:
        0;

    transition:
        .25s;
}

.semaforo.verde {

    background:
        var(--verde);

    box-shadow:
        0 0 7px rgba(98,184,111,.55);
}

.semaforo.amarillo {

    background:
        var(--amarillo);

    box-shadow:
        0 0 7px rgba(232,188,85,.55);
}

.semaforo.rojo {

    background:
        var(--rojo);

    box-shadow:
        0 0 8px rgba(223,101,101,.58);
}

.semaforo.pulse {

    animation:
        semaforoPop .25s ease;
}

@keyframes semaforoPop {

    0% {
        transform:
            scale(.6);
    }

    60% {
        transform:
            scale(1.35);
    }

    100% {
        transform:
            scale(1);
    }
}


/* =========================================================
   🎀 BOTONES
========================================================= */

.botones {

    display:
        flex;

    gap:
        10px;

    margin-top:
        20px;
}

button {

    flex:
        1;

    border:
        none;

    border-radius:
        17px;

    padding:
        14px 10px;

    font-size:
        14px;

    font-weight:
        bold;

    cursor:
        pointer;

    transition:
        transform .2s,
        box-shadow .2s,
        filter .2s;

    box-shadow:
        0 7px 16px rgba(100,55,45,.15);
}

button:active {

    transform:
        scale(.95);
}

.btnGenerar {

    background:
        linear-gradient(
            135deg,
            #7b4b3d,
            #684034
        );

    color:
        white;
}

.btnGenerar:hover {

    transform:
        translateY(-2px);

    box-shadow:
        0 10px 20px rgba(100,55,45,.23);

    filter:
        brightness(1.04);
}

.btnNueva {

    background:
        linear-gradient(
            135deg,
            #f7d0db,
            #f1c1cf
        );

    color:
        #653b31;
}

.btnNueva:hover {

    background:
        linear-gradient(
            135deg,
            #f4c6d3,
            #edb9c9
        );

    transform:
        translateY(-2px);

    box-shadow:
        0 10px 20px rgba(100,55,45,.16);
}


/* =========================================================
   📋 RESULTADO
========================================================= */

#resultado {

    width:
        100%;

    min-height:
        140px;

    margin-top:
        16px;

    padding:
        15px;

    border:
        2px solid transparent;

    outline:
        none;

    resize:
        vertical;

    border-radius:
        18px;

    background:
        rgba(255,255,255,.9);

    color:
        #4d3028;

    font-family:
        monospace;

    font-size:
        14px;

    line-height:
        1.5;

    box-shadow:
        var(--sombra-suave);

    transition:
        .3s;
}

#resultado:focus {

    border-color:
        rgba(201,130,148,.35);

    box-shadow:
        0 8px 20px rgba(100,55,45,.15),
        0 0 0 4px rgba(233,139,170,.08);
}

#mensaje {

    text-align:
        center;

    margin-top:
        15px;

    font-size:
        14px;

    font-weight:
        bold;

    color:
        #70483c;

    min-height:
        20px;

    animation:
        mensajeEntrada .3s ease;
}

@keyframes mensajeEntrada {

    from {
        opacity: 0;
        transform:
            translateY(4px);
    }

    to {
        opacity: 1;
        transform:
            translateY(0);
    }
}


/* =========================================================
   🐻 OSITO ANIMADO
========================================================= */

#animacionOso {

    position:
        fixed;

    left:
        50%;

    top:
        50%;

    transform:
        translate(-50%,-50%)
        scale(.5);

    opacity:
        0;

    pointer-events:
        none;

    z-index:
        999;

    text-align:
        center;

    transition:
        .3s;
}

#animacionOso.mostrar {

    opacity:
        1;

    transform:
        translate(-50%,-50%)
        scale(1);
}

.osoAnimado {

    font-size:
        80px;

    animation:
        osoSalta .8s ease-in-out infinite;

    filter:
        drop-shadow(
            0 8px 8px
            rgba(0,0,0,.18)
        );
}

.textoOso {

    background:
        white;

    color:
        #694237;

    padding:
        10px 18px;

    border-radius:
        20px;

    margin-top:
        4px;

    font-weight:
        bold;

    box-shadow:
        0 7px 22px rgba(0,0,0,.18);
}

@keyframes osoSalta {

    0%,100% {

        transform:
            translateY(0)
            rotate(-3deg);
    }

    50% {

        transform:
            translateY(-12px)
            rotate(3deg);
    }
}


/* =========================================================
   🎀 DECORACIÓN FINAL
========================================================= */

.decoracionFinal {

    text-align:
        center;

    margin-top:
        24px;

    font-size:
        20px;

    color:
        #7d554b;

    opacity:
        .82;

    animation:
        decoracionFinalAnim
        3s ease-in-out infinite;
}

.decoracionFinal::before {

    content:
        "☕  ";

}

.decoracionFinal::after {

    content:
        "  🐻";

}

@keyframes decoracionFinalAnim {

    0%,100% {

        transform:
            translateY(0);
    }

    50% {

        transform:
            translateY(-4px);
    }
}


/* =========================================================
   🌙 MODO OSCURO
========================================================= */

body.oscuro {

    background:
        #24191c;

    color:
        #f5e5e8;
}

body.oscuro::before {

    background:
        rgba(255,170,195,.035);
}

body.oscuro::after {

    background:
        rgba(255,170,195,.03);
}

body.oscuro .modoSuperior {

    background:
        rgba(70,45,52,.55);

    box-shadow:
        0 5px 15px rgba(0,0,0,.2);
}

body.oscuro h1 {

    color:
        #ffd2df;
}

body.oscuro .subtitulo,
body.oscuro #fecha {

    color:
        #d5afb9;
}

body.oscuro .buscador {

    background:
        #38272b;

    color:
        #f7e9ec;

    box-shadow:
        0 5px 15px rgba(0,0,0,.3);
}

body.oscuro .buscador::placeholder {

    color:
        #aa8991;
}

body.oscuro .buscador:focus {

    border-color:
        rgba(233,139,170,.25);

    box-shadow:
        0 8px 20px rgba(0,0,0,.3),
        0 0 0 4px rgba(233,139,170,.06);
}

body.oscuro .area {

    background:
        #302125;

    box-shadow:
        0 9px 24px rgba(0,0,0,.35);
}

body.oscuro .area::before {

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(255,180,205,.20),
            transparent
        );
}

body.oscuro .tituloArea {

    border-color:
        #53383e;
}

body.oscuro .tituloArea h2 {

    color:
        #ffd6df;
}

body.oscuro .producto {

    border-color:
        #493339;
}

body.oscuro .producto:hover {

    background:
        #39282d;
}

body.oscuro .nombre {

    color:
        #f5e5e8;
}

body.oscuro .cantidad {

    background:
        #261a1e;

    border-color:
        #5a3c44;

    color:
        #f7e9ec;
}

body.oscuro .cantidad:focus {

    background:
        #2d2025;

    border-color:
        #a96d80;
}

body.oscuro .metaProducto {

    color:
        #d2aeb8;
}

body.oscuro #resultado {

    background:
        #38272b;

    color:
        #f7e9ec;
}

/* =====================================================
   CREAR AREAS
===================================================== */

function crearAreas() {

    const grupos = {

        gris: document.getElementById("gris"),

        morado: document.getElementById("morado"),

        comida: document.getElementById("comida")

    };


    Object.keys(grupos).forEach(group => {

        const area = document.createElement("div");

        area.className = "area";


        const titulo = document.createElement("div");

        titulo.className = "tituloArea";


        const h2 = document.createElement("h2");

        h2.textContent = nombresAreas[group];


        titulo.appendChild(h2);

        area.appendChild(titulo);


        productos
            .filter(producto => producto.group === group)
            .forEach((producto, index) => {

                const fila = document.createElement("div");

                fila.className = "producto";


                const infoProducto =
                    document.createElement("div");

                infoProducto.className =
                    "infoProducto";


                const nombre =
                    document.createElement("div");

                nombre.className =
                    "nombre";

                nombre.textContent =
                    producto.nombre;


                const meta =
                    document.createElement("div");

                meta.className =
                    "metaProducto";

                meta.textContent =
                    "Meta: " + producto.objetivo;


                infoProducto.appendChild(nombre);

                infoProducto.appendChild(meta);


                const controles =
                    document.createElement("div");

                controles.className =
                    "controlCantidad";


                const semaforo =
                    document.createElement("span");

                semaforo.className =
                    "semaforo";


                const input =
                    document.createElement("input");

                input.type = "number";

                input.min = "0";

                input.step = "any";

                input.inputMode = "numeric";

                input.className =
                    "cantidad";

                input.id =
                    "producto_" +
                    group +
                    "_" +
                    index;


                const guardado =
                    localStorage.getItem(
                        "inventarioFisico_v2_" +
                        input.id
                    );


                if (guardado !== null) {

                    input.value =
                        guardado;

                }


                input.addEventListener(
                    "input",
                    function() {

                        const valor =
                            this.value;


                        localStorage.setItem(
                            "inventarioFisico_v2_" +
                            this.id,
                            valor
                        );


                        actualizarSemaforo(
                            this,
                            semaforo,
                            producto.objetivo
                        );

                    }
                );


                controles.appendChild(
                    semaforo
                );

                controles.appendChild(
                    input
                );


                fila.appendChild(
                    infoProducto
                );

                fila.appendChild(
                    controles
                );

                area.appendChild(
                    fila
                );


                if (input.value !== "") {

                    actualizarSemaforo(
                        input,
                        semaforo,
                        producto.objetivo
                    );

                }

            });


        grupos[group].appendChild(
            area
        );

    });

}


/* =====================================================
   SEMAFORO
===================================================== */

function actualizarSemaforo(
    input,
    semaforo,
    objetivo
) {

    const valor =
        parseFloat(input.value);


    semaforo.classList.remove(
        "verde",
        "amarillo",
        "rojo"
    );


    if (isNaN(valor)) {

        return;

    }


    if (valor >= objetivo) {

        semaforo.classList.add(
            "verde"
        );

    }

    else if (valor >= objetivo * .5) {

        semaforo.classList.add(
            "amarillo"
        );

    }

    else {

        semaforo.classList.add(
            "rojo"
        );

    }


    semaforo.classList.remove(
        "pulse"
    );

    void semaforo.offsetWidth;

    semaforo.classList.add(
        "pulse"
    );

}


/* =====================================================
   BUSCADOR
===================================================== */

const buscador =
    document.getElementById("buscador");


buscador.addEventListener(
    "input",
    function() {

        const busqueda =
            this.value
                .toLowerCase()
                .trim();


        this.classList.toggle(
            "busquedaActiva",
            busqueda !== ""
        );


        document
            .querySelectorAll(".area")
            .forEach(area => {

                let encontrados = 0;


                area
                    .querySelectorAll(".producto")
                    .forEach(fila => {

                        const nombre =
                            fila
                                .querySelector(".nombre")
                                .textContent
                                .toLowerCase();


                        const coincide =
                            busqueda === "" ||
                            nombre.includes(busqueda);


                        fila.classList.remove(
                            "busquedaEntrada"
                        );


                        if (coincide) {

                            encontrados++;

                            fila.style.display =
                                "flex";

                            fila.style.opacity =
                                "1";

                            fila.style.transform =
                                "translateY(0)";


                            if (busqueda !== "") {

                                void fila.offsetWidth;

                                fila.classList.add(
                                    "busquedaEntrada"
                                );

                            }

                        }

                        else {

                            fila.style.display =
                                "none";

                            fila.style.opacity =
                                "0";

                            fila.style.transform =
                                "translateY(-4px)";

                        }

                    });


                if (encontrados === 0) {

                    area.style.display =
                        "none";

                }

                else {

                    area.style.display =
                        "block";

                    area.style.opacity =
                        "1";

                    area.style.transform =
                        "translateY(0)";

                }

            });

    }
);


/* =====================================================
   CAMBIO DE OSITOS
===================================================== */

const decoraciones = [

    ["🐻","☕","🐻","☕","🐻","☕","🐻"],

    ["🧸","☕","🧸","☕","🧸","☕","🧸"],

    ["🐻","🍪","🐻","🍪","🐻","🍪","🐻"],

    ["🧸","🧋","🧸","🧋","🧸","🧋","🧸"]

];


let decoracionActual = 0;


function cambiarOsitos() {

    const contenedor =
        document.getElementById(
            "decoracionSuperior"
        );


    decoracionActual++;


    if (
        decoracionActual >=
        decoraciones.length
    ) {

        decoracionActual = 0;

    }


    contenedor.classList.remove(
        "decoracionCambio"
    );


    void contenedor.offsetWidth;


    contenedor.innerHTML =
        decoraciones[
            decoracionActual
        ]
        .map(emoji => {

            return `
                <span>${emoji}</span>
            `;

        })
        .join("");


    contenedor.classList.add(
        "decoracionCambio"
    );

}


setInterval(
    cambiarOsitos,
    3500
);


/* =====================================================
   GENERAR LISTA
===================================================== */

function generarYCopiar() {

    const faltantes = [];


    productos.forEach(producto => {

        const productosGrupo =
            productos.filter(
                p =>
                    p.group ===
                    producto.group
            );


        const indice =
            productosGrupo.indexOf(
                producto
            );


        const input =
            document.querySelector(
                `#producto_${producto.group}_${indice}`
            );


        if (!input) {

            return;

        }


        const valor =
            parseFloat(input.value);


        if (isNaN(valor)) {

            return;

        }


        if (
            valor <
            producto.objetivo
        ) {

            const falta =
                producto.objetivo -
                valor;


            faltantes.push(
                `${producto.nombre}: ${falta}`
            );

        }

    });


    const resultado =
        document.getElementById(
            "resultado"
        );

    const mensaje =
        document.getElementById(
            "mensaje"
        );


    if (
        faltantes.length ===
        0
    ) {

        resultado.value =
            "🐻✨ No falta nada 😎";

        mensaje.textContent =
            "¡Todo está completo! 🐻";


        mostrarOso();


        setTimeout(() => {

            ocultarOso();

        }, 1600);


        return;

    }


    const texto =
        "*URGENTES 🚨*\n\n" +
        faltantes.join("\n");


    resultado.value =
        texto;


    mensaje.textContent =
        "¡Lista generada y copiada! 🐻☕";


    copiarTexto(texto);

}


/* =====================================================
   COPIAR
===================================================== */

function copiarTexto(texto) {

    if (
        navigator.clipboard &&
        window.isSecureContext
    ) {

        navigator.clipboard
            .writeText(texto)
            .then(() => {

                mostrarOso();


                setTimeout(() => {

                    ocultarOso();

                }, 1600);

            })
            .catch(() => {

                copiarAlternativo(
                    texto
                );

            });

    }

    else {

        copiarAlternativo(
            texto
        );

    }

}


/* =====================================================
   COPIADO ALTERNATIVO
===================================================== */

function copiarAlternativo(texto) {

    const temporal =
        document.createElement(
            "textarea"
        );


    temporal.value =
        texto;


    document.body.appendChild(
        temporal
    );


    temporal.select();


    try {

        document.execCommand(
            "copy"
        );


        mostrarOso();


        setTimeout(() => {

            ocultarOso();

        }, 1600);

    }

    catch (error) {

        document
            .getElementById(
                "mensaje"
            )
            .textContent =
            "Lista generada. Cópiala manualmente 🐻";

    }


    document.body.removeChild(
        temporal
    );

}


/* =====================================================
   ANIMACION OSO
===================================================== */

function mostrarOso() {

    document
        .getElementById(
            "animacionOso"
        )
        .classList.add(
            "mostrar"
        );

}


function ocultarOso() {

    document
        .getElementById(
            "animacionOso"
        )
        .classList.remove(
            "mostrar"
        );

}


/* =====================================================
   NUEVA LISTA
===================================================== */

function nuevaLista() {

    const confirmar =
        confirm(
            "¿Seguro que quieres limpiar toda la lista actual? 🐻"
        );


    if (!confirmar) {

        return;

    }


    const inputs =
        document.querySelectorAll(
            ".cantidad"
        );


    inputs.forEach(
        (input, index) => {

            input.style.transition =
                ".3s";

            input.style.transform =
                "scale(.8)";

            input.style.opacity =
                "0";


            setTimeout(() => {

                input.value = "";

                input.style.transform =
                    "scale(1)";

                input.style.opacity =
                    "1";

            }, 100 + index * 4);


            localStorage.removeItem(
                "inventarioFisico_v2_" +
                input.id
            );


            const semaforo =
                input.parentElement
                    .querySelector(
                        ".semaforo"
                    );


            semaforo.classList.remove(
                "verde",
                "amarillo",
                "rojo"
            );

        }
    );


    document
        .getElementById(
            "resultado"
        )
        .value = "";


    document
        .getElementById(
            "mensaje"
        )
        .textContent =
        "✨ Lista nueva lista para comenzar 🐻";


    buscador.value = "";


    buscador.classList.remove(
        "busquedaActiva"
    );


    document
        .querySelectorAll(
            ".area"
        )
        .forEach(area => {

            area.style.display =
                "block";

            area.style.opacity =
                "1";

            area.style.transform =
                "translateY(0)";


            area
                .querySelectorAll(
                    ".producto"
                )
                .forEach(fila => {

                    fila.style.display =
                        "flex";

                    fila.style.opacity =
                        "1";

                    fila.style.transform =
                        "translateY(0)";

                    fila.classList.remove(
                        "busquedaEntrada"
                    );

                });

        });

}


/* =====================================================
   MODO OSCURO
===================================================== */

const modoOscuro =
    document.getElementById(
        "modoOscuro"
    );

const iconoModo =
    document.getElementById(
        "iconoModo"
    );


function actualizarModo() {

    if (
        modoOscuro.checked
    ) {

        document.body.classList.add(
            "oscuro"
        );

        iconoModo.textContent =
            "☀️";

    }

    else {

        document.body.classList.remove(
            "oscuro"
        );

        iconoModo.textContent =
            "🌙";

    }


    actualizarFondoScroll();

}


const modoGuardado =
    localStorage.getItem(
        "bearyModoOscuro"
    );


if (
    modoGuardado ===
    "true"
) {

    modoOscuro.checked =
        true;

}


actualizarModo();


modoOscuro.addEventListener(
    "change",
    function() {

        localStorage.setItem(
            "bearyModoOscuro",
            this.checked
        );

        actualizarModo();

    }
);


/* =====================================================
   FONDO PROGRESIVO
===================================================== */

function actualizarFondoScroll() {

    const alturaTotal =
        document.documentElement
            .scrollHeight -
        window.innerHeight;


    const posicion =
        window.scrollY;


    const progreso =
        alturaTotal > 0
            ? Math.min(
                posicion /
                alturaTotal,
                1
            )
            : 0;


    let inicio;
    let final;


    if (
        !modoOscuro.checked
    ) {

        inicio =
            [255, 220, 232];

        final =
            [239, 190, 210];

    }

    else {

        inicio =
            [36, 25, 28];

        final =
            [26, 17, 21];

    }


    const r =
        Math.round(
            inicio[0] +
            (
                final[0] -
                inicio[0]
            ) *
            progreso
        );


    const g =
        Math.round(
            inicio[1] +
            (
                final[1] -
                inicio[1]
            ) *
            progreso
        );


    const b =
        Math.round(
            inicio[2] +
            (
                final[2] -
                inicio[2]
            ) *
            progreso
        );


    document.body.style.backgroundColor =
        `rgb(${r}, ${g}, ${b})`;

}


window.addEventListener(
    "scroll",
    actualizarFondoScroll,
    { passive: true }
);


/* =====================================================
   FECHA
===================================================== */

function mostrarFecha() {

    const fecha =
        new Date();


    const opciones = {

        weekday: "long",

        day: "numeric",

        month: "long",

        year: "numeric"

    };


    document
        .getElementById(
            "fecha"
        )
        .textContent =
        fecha.toLocaleDateString(
            "es-MX",
            opciones
        );

}


/* =====================================================
   INICIAR APP
===================================================== */

crearAreas();

mostrarFecha();

actualizarFondoScroll();

</script>
